name: mate_player
description: "Audio Player"
version: 1.2.0+4

environment:
  sdk: ^3.11.1
  flutter: 3.41.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  go_router: ^17.1.0
  provider: ^6.1.5+1
  audioplayers: ^6.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  shared_preferences: ^2.5.4
  json_serializable: ^6.13.0
  audio_metadata_reader: ^1.4.2
  gap: ^3.0.1
  lottie: ^3.3.2
  file_picker: ^10.3.10
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  dynamic_color: ^1.8.1
  skeletonizer: ^2.1.3
  worker_manager: ^7.2.7
  permission_handler: ^12.0.1
  flutter_svg: ^2.2.4
  path: ^1.9.1
  json_annotation: ^4.11.0
