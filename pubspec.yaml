  file_selector: ^1.1.0

dependency_overrides:
  archive: ^4.0.9

dev_dependencies:
  drift_dev: ^2.32.0
  build_runner: ^2.12.2

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
